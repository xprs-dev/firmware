<!doctype html>
<!-- The hotspot chat page. SOURCE OF TRUTH: edit this file, then regenerate
     chat_page.c with tool/embed_page.py. Theme and logo font are the old
     the XPRS chat (xprs_http/chat_page.c), bubbles lean Telegram.
     Identity is created silently on first visit; the menu lets a user show
     the npub, export the nsec, import another, or start fresh. The crypto
     is the XPRS 9.1.2 short-Schnorr, validated against the spec's worked
     example. Everything inline: captive WebViews have no internet, no
     secure context, often no localStorage. -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPRS</title>
<style>
/*FONTFACE*/
:root{--accent:#ffa86a;--bg:#101010;--text:#f0f0f0;
      --border:rgba(255,240,224,.125);--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;
     display:flex;flex-direction:column}
.header{border-bottom:1px solid var(--border);height:40px;
        padding:0 12px;margin-top:5px;
        display:flex;align-items:center;gap:12px;position:relative}
.header .logo{font-family:'Wartext',sans-serif;font-size:38px;
        color:var(--accent);letter-spacing:5px;margin-top:-12px;
        transform:scaleY(.72);transform-origin:center}
.menu{margin-left:auto;position:relative}
.my-callsign{color:var(--accent);font-size:12px;font-weight:bold;
        margin-right:8px}
.menu-btn{background:transparent;border:1px solid var(--border);
        color:var(--text);padding:6px 8px;border-radius:4px;cursor:pointer;
        font-size:16px;line-height:1}
.menu-panel{position:absolute;right:0;top:38px;background:#151515;
        border:1px solid var(--border);border-radius:6px;min-width:200px;
        display:none;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.menu-panel.open{display:block}
.menu-panel button{width:100%;background:transparent;border:0;
        color:var(--text);padding:10px 12px;text-align:left;cursor:pointer;
        font-size:13px}
.menu-panel button:hover{background:rgba(255,255,255,.06)}
#content{flex:1;display:flex;min-height:0}
#side{width:150px;border-right:1px solid var(--border);overflow-y:auto;
      padding:8px 0;flex-shrink:0}
#side .room{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .room.on{color:var(--accent);border-left:2px solid var(--accent);
      background:rgba(255,168,106,.06)}
#side .roomhead{padding:8px 12px 2px;font-size:10px;color:#555;
      text-transform:uppercase;letter-spacing:1px}
#chatcol{flex:1;display:flex;flex-direction:column;min-width:0}
@media (max-width:640px) and (orientation:portrait){
  #content{flex-direction:column}
  #side{width:auto;border-right:0;border-bottom:1px solid var(--border);
        display:flex;overflow-x:auto;overflow-y:hidden;padding:4px 8px;
        gap:4px;align-items:center}
  #side .roomhead{display:none}
  #side .room{padding:5px 10px;border:1px solid var(--border);
        border-radius:12px;flex-shrink:0}
  #side .room.on{border-color:var(--accent);border-left-width:1px}
}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;
        flex-direction:column;gap:8px}
.msg{max-width:85%}
.msg .meta{font-size:11px;margin-bottom:2px}
.msg .meta.under{margin-bottom:0;margin-top:2px}
.msg .dots{background:transparent;border:0;color:var(--muted);
        cursor:pointer;font-size:13px;padding:0 5px}
.msg .likes{color:#e0708a;font-size:11px;margin-left:6px}
#msgmenu{position:fixed;background:#151515;border:1px solid var(--border);
        border-radius:6px;z-index:20;display:none;min-width:170px;
        box-shadow:0 8px 20px rgba(0,0,0,.35)}
#msgmenu button{width:100%;background:transparent;border:0;color:var(--text);
        padding:10px 12px;text-align:left;cursor:pointer;font-size:13px}
#msgmenu button:hover{background:rgba(255,255,255,.06)}
.msg .quote{font-size:11px;color:var(--muted);border-left:2px solid
        var(--accent);padding:2px 6px;margin-bottom:3px;text-align:left}
#replybar{display:none;border-top:1px solid var(--border);padding:4px 12px;
        font-size:11px;color:var(--muted);background:#161310;
        align-items:center;gap:8px}
#replybar.on{display:flex}
#replybar .x{margin-left:auto;background:transparent;border:0;
        color:var(--muted);cursor:pointer;font-size:14px}
.msg .author{color:var(--accent);font-weight:bold}
.msg .time{color:var(--muted);margin-left:6px}
.msg .bubble{display:inline-block;background:#1b1b1b;
        border:1px solid var(--border);border-radius:12px;
        padding:8px 12px;word-wrap:break-word;text-align:left;
        max-width:100%}
.msg.local{align-self:flex-end;text-align:right}
.msg.local .bubble{background:#2a1c10;border-color:rgba(255,168,106,.35);
        border-bottom-right-radius:4px}
.msg.remote{align-self:flex-start;text-align:left}
.msg.remote .bubble{border-bottom-left-radius:4px}
.badge{display:inline-block;font-size:9px;font-weight:bold;
        padding:1px 5px;border-radius:3px;margin-left:6px}
.badge.ok{background:#1b5e20;color:#81c784}
.badge.bad{background:#b71c1c;color:#ef9a9a}
.mood{font-size:10px;font-style:italic;color:var(--accent);margin-left:4px}
.input-area{border-top:1px solid var(--border);padding:8px;display:flex;
        gap:6px;align-items:center}
.input-area input{flex:1;min-width:0;background:transparent;
        border:1px solid var(--border);border-radius:4px;padding:8px;
        color:var(--text);font-size:16px;outline:none}
.input-area input:focus{border-color:var(--accent)}
.input-area button{flex-shrink:0;font-family:'Wartext',sans-serif;
        font-size:18px;font-weight:bold;background:var(--accent);
        color:var(--bg);border:none;border-radius:4px;padding:4px 12px;
        cursor:pointer}
.status-bar{padding:4px 12px;font-size:10px;color:var(--muted);
        display:flex;justify-content:space-between}
.status-bar a{color:var(--muted)}
.snackbar{visibility:hidden;min-width:250px;background:#333;color:#fff;
        text-align:center;border-radius:4px;padding:12px;position:fixed;
        z-index:10;left:50%;bottom:60px;transform:translateX(-50%);
        font-size:14px}
.snackbar.show{visibility:visible;animation:fadein .3s,fadeout .3s 2.7s}
@keyframes fadein{from{bottom:0;opacity:0}to{bottom:60px;opacity:1}}
@keyframes fadeout{from{bottom:60px;opacity:1}to{bottom:0;opacity:0}}
</style></head><body>
<div class="header">
  <span class="logo">XPRS</span>
  <div class="menu">
    <span class="my-callsign" id="call"></span>
    <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>
    <div class="menu-panel" id="menu">
      <button onclick="clearChat()">Clear chat view</button>
      <button onclick="showNpub()">Show my npub</button>
      <button onclick="exportNsec()">Export nsec</button>
      <button onclick="importNsec()">Import another nsec</button>
      <button onclick="newIdentity()">New identity</button>
      <button onclick="toggleSound()" id="sndbtn">Sound: on</button>
    </div>
  </div>
</div>
<div id="content">
  <div id="side"></div>
  <div id="chatcol">
    <div class="messages" id="msgs"></div>
    <div class="status-bar">
      <span id="stat">connecting</span>
      <span>XPRS station &middot; <a href="/config">settings</a></span>
    </div>
    <div id="replybar"><span id="replyinfo"></span>
      <button class="x" onclick="cancelReply()">&#10005;</button></div>
    <div class="input-area">
      <input id="txt" maxlength="180" placeholder="Message"
             onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">&gt;</button>
    </div>
  </div>
</div>
<div class="snackbar" id="snack"></div>
<div id="msgmenu"></div>
<script>
"use strict";
/*CRYPTO*/

// ---- storage: localStorage -> cookie -> memory (captive WebViews) ----
var mem={};
function stGet(k){
  try{var v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}
  var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));
  if(m)return decodeURIComponent(m[1]);
  return mem[k]!==undefined?mem[k]:null;}
function stSet(k,v){
  try{localStorage.setItem(k,v);}catch(e){}
  try{document.cookie=k+'='+encodeURIComponent(v)+'; max-age=31536000; path=/';}catch(e){}
  mem[k]=v;}

function snack(t){
  var s=document.getElementById('snack');
  s.textContent=t;s.className='snackbar show';
  setTimeout(function(){s.className='snackbar';},3000);}
function toggleMenu(){
  var m=document.getElementById('menu');
  m.className=m.className.indexOf('open')>=0?'menu-panel':'menu-panel open';}

// ---- identity: made silently on first visit; the menu changes it ----
var priv=null,npub='',mycall='';
function useKey(bytes){
  priv=bytes;
  npub=npubEncode(pubkeyX(priv));
  mycall=callsignFromNpub(npub);
  stSet('xprs_nsec',nsecEncode(priv));
  document.getElementById('call').textContent=mycall;
}
function randKey(){
  var b=new Uint8Array(32);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);
  else for(var i=0;i<32;i++)b[i]=Math.floor(Math.random()*256);
  return (b2n(b)===0n||b2n(b)>=N)?randKey():b;}
function showNpub(){toggleMenu();prompt('Your public key (share freely):',npub);}
function exportNsec(){toggleMenu();
  prompt('Your SECRET key. Anyone holding it IS '+mycall+':',nsecEncode(priv));}
function importNsec(){toggleMenu();
  var v=prompt('Paste an nsec to become that identity:');
  if(!v)return;
  var b=nsecDecode(v.trim());
  if(!b||b2n(b)===0n||b2n(b)>=N){snack('That is not a valid nsec');return;}
  useKey(b);identSent=0;seen={};
  document.getElementById('msgs').innerHTML='';
  snack('Now chatting as '+mycall);load();}
function newIdentity(){toggleMenu();
  useKey(randKey());identSent=0;seen={};
  document.getElementById('msgs').innerHTML='';
  snack('New identity: '+mycall);load();}

// ---- XPRS wires ----
function tsNow(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+
    '_'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
function aux32(){var b=new Uint8Array(32);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);
  else for(var i=0;i<32;i++)b[i]=Math.floor(Math.random()*256);return b;}
function signWire(canonical){
  var sig=' sig:'+b85enc(xprsSign(canonical,b2n(priv),aux32()));
  var i=canonical.indexOf(' m:');
  if(i>=0)return canonical.slice(0,i)+sig+canonical.slice(i);
  return canonical+sig;}

// ---- sending: POST -> GET -> Image() (hostile WebViews) ----
function postWire(wire,cb){
  var done=false;
  function fin(ok){if(!done){done=true;if(cb)cb(ok);}}
  try{
    var x=new XMLHttpRequest();
    x.open('POST','/api/xprs/send',true);
    x.timeout=4000;
    x.onload=function(){fin(x.status===200);};
    x.onerror=x.ontimeout=function(){getFallback(wire,fin);};
    x.send(JSON.stringify({wire:wire}));
  }catch(e){getFallback(wire,fin);}
}
function getFallback(wire,fin){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/api/xprs/send?wire='+encodeURIComponent(wire),true);
    x.timeout=4000;
    x.onload=function(){fin(x.status===200);};
    x.onerror=x.ontimeout=function(){
      try{new Image().src='/api/xprs/send?wire='+encodeURIComponent(wire);}catch(e){}
      fin(true);};
    x.send();
  }catch(e){fin(false);}
}

var identSent=0;
function sendIdentity(){
  var now=Date.now();
  if(now-identSent<86400000)return;
  identSent=now;
  postWire(signWire('t:identity f:'+mycall+' ts:'+tsNow()+' k:'+npub),null);
}
function sendMsg(){
  var t=document.getElementById('txt');
  var text=t.value.trim();
  if(!text||!priv)return;
  text=text.replace(/[\x00-\x1f]/g,' ');
  sendIdentity();
  var thread='';
  if(replyTo){
    if(replyTo.root)thread=' root:'+replyTo.root;
    thread+=' r:'+replyTo.id;
  }
  var where='';
  if(curRoom==='local')where=' scope:local';
  else if(curRoom.slice(0,3)==='dm:')where=' d:'+curRoom.slice(3);
  /* The Social feed publishes a status (27): kept and read later, not a
   * conversation. A reply to a status is itself a status carrying r:. */
  var typ=curRoom==='social'?'t:status':'t:message';
  var wire=signWire(typ+' f:'+mycall+' ts:'+tsNow()+where+thread+' m:'+text);
  if(wire.length>250){snack('Message too long');return;}
  t.value='';
  cancelReply();
  /* On the screen immediately -- the archive round trip (index writer +
   * the next poll) takes seconds, and a sender should not wait on it.
   * The wire is archived verbatim, so marking it seen dedups the echo. */
  render({from:mycall,ts:Math.floor(Date.now()/1000),sig:'verified',
          to:curRoom.slice(0,3)==='dm:'?curRoom.slice(3):'',wire:wire});
  postWire(wire,function(ok){
    if(!ok)snack('Send failed');});
}

// ---- receiving ----
var seen={};
// Section 5 identifier: sha256 over the wire with sig: and via: removed,
// first six hex characters. What r: and root: point at.
function wireId(w){
  var canon=w.replace(/ sig:[!-~]{60}/,'').replace(/ via:[A-Za-z0-9,\-]+/,'');
  return hex(sha256(s2b(canon))).slice(0,6);}

// Replying (XPRS 6.4): r: names the parent; below the first level root:
// names the thread. idmap lets the quote show who said what.
var idmap={};
var replyTo=null;   /* {id, root, from, snip} */
function startReply(id){
  var p=idmap[id];
  replyTo={id:id,
           root:(p&&p.root)||(p&&p.r)||'',
           from:p?p.from:id, snip:p?p.text.slice(0,40):''};
  document.getElementById('replyinfo').textContent=
    'Replying to '+replyTo.from+': '+replyTo.snip;
  document.getElementById('replybar').className='on';
  document.getElementById('txt').focus();}
function cancelReply(){
  replyTo=null;
  document.getElementById('replybar').className='';}

/* New-message notice: a short beep (WebAudio -- no secure context needed,
 * but it must be unlocked by a user gesture), a title counter cleared on
 * focus, and a vibration where the device has one. */
var sndOn=stGet('xprs_sound')!=='0';
var audioCtx=null,unread=0,baseTitle=document.title;
function unlockAudio(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
document.addEventListener('click',unlockAudio);
document.addEventListener('keydown',unlockAudio);
function beep(){
  if(!sndOn||!audioCtx)return;
  try{
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.15);
  }catch(e){}}
function notice(){
  beep();
  if(navigator.vibrate)try{navigator.vibrate(80);}catch(e){}
  if(document.hidden||!document.hasFocus()){
    unread++;document.title='('+unread+') '+baseTitle;}}
window.addEventListener('focus',function(){
  unread=0;document.title=baseTitle;});
function toggleSound(){
  sndOn=!sndOn;stSet('xprs_sound',sndOn?'1':'0');
  document.getElementById('sndbtn').textContent='Sound: '+(sndOn?'on':'off');
  toggleMenu();}

/* ---- likes (XPRS 6.5): add:like / remove:like on a message's id ---- */
var likes={};        /* msgId -> {callsign:1} */
var domById={};      /* msgId -> bubble meta element to refresh */
var myLikes={};      /* msgId -> 1 (mine, for toggling) */
function likeCount(id){var n=0;for(var k in likes[id]||{})n++;return n;}
function refreshLikes(id){
  var el=domById[id];if(!el)return;
  var n=likeCount(id);
  el.textContent=n?('\u2665 '+n):'';}
function applyReaction(row){
  var w=row.wire||'';
  var rm=w.match(/ r:([0-9a-f]{6})/);
  if(!rm)return;
  var id=rm[1],from=baseCall(row.from||'');
  if(!likes[id])likes[id]={};
  if(/ add:like/.test(w)){likes[id][from]=1;}
  else if(/ remove:like/.test(w)){delete likes[id][from];}
  if(from===baseCall(mycall))myLikes[id]=/ add:like/.test(w)?1:0;
  refreshLikes(id);}
function sendLike(id){
  var verb=myLikes[id]?'remove':'add';
  myLikes[id]=verb==='add'?1:0;
  if(!likes[id])likes[id]={};
  if(verb==='add')likes[id][baseCall(mycall)]=1;
  else delete likes[id][baseCall(mycall)];
  refreshLikes(id);
  var par=idmap[id];
  var sc=(par&&par.scopeLocal)?' scope:local':'';
  var wire=signWire('t:reaction f:'+mycall+' ts:'+tsNow()+sc+' '+verb+':like r:'+id);
  postWire(wire,null);}

/* ---- the per-message menu ---- */
function showMsgMenu(ev,id,from,own){
  var m=document.getElementById('msgmenu');
  var items='<button onclick="menuAct(\'reply\',\''+id+'\',\''+from+'\')">Reply</button>'+
    '<button onclick="menuAct(\'like\',\''+id+'\',\''+from+'\')">'+
      (myLikes[id]?'Unlike':'Like \u2665')+'</button>';
  if(!own)items+='<button onclick="menuAct(\'dm\',\''+id+'\',\''+from+'\')">Message '+from+'</button>';
  m.innerHTML=items;
  m.style.display='block';
  var x=Math.min(ev.clientX,window.innerWidth-180);
  var y=Math.min(ev.clientY,window.innerHeight-140);
  m.style.left=x+'px';m.style.top=y+'px';
  ev.stopPropagation();}
document.addEventListener('click',function(){
  document.getElementById('msgmenu').style.display='none';});
function menuAct(act,id,from){
  document.getElementById('msgmenu').style.display='none';
  if(act==='reply')startReply(id);
  else if(act==='like')sendLike(id);
  else if(act==='dm')openDm(from);}

var clearedBefore=parseInt(stGet('xprs_cleared')||'0',10)||0;

/* Rooms (XPRS 13.11): Local is the scope:local conversation -- the packets
 * honest stations keep off LoRa, radio and the internet. Global is the
 * default scope, which goes anywhere. A packet with d: naming a person is a
 * 1:1 and gets its own room. */
var curRoom=stGet('xprs_room')||'local';
var allRows=[];              /* every row heard, for room switches */
var dmPeers={};              /* callsign -> true */
function baseCall(c){var i=c.indexOf('-');return i<0?c:c.slice(0,i);}
function roomOf(row){
  var w=row.wire||'';
  var to=row.to||'';
  /* A status (27) is a feed post, not a conversation: its own timeline. */
  if((row.type||'')==='status'||w.indexOf('t:status ')===0)return 'social';
  if(to&&to[0]!=='#'){
    if(baseCall(to)===baseCall(mycall))return 'dm:'+baseCall(row.from);
    if(baseCall(row.from)===baseCall(mycall))return 'dm:'+baseCall(to);
    return null;             /* somebody else's 1:1: not our room */
  }
  return / scope:local(?: |$)/.test(w)?'local':'global';
}
function roomLabel(r){
  return r==='local'?'Local':r==='global'?'Global':
         r==='social'?'Social':r.slice(3);}
function renderSide(){
  var el=document.getElementById('side');
  var htmlp='<div class="roomhead">Rooms</div>';
  var rooms=['local','global'];
  var peers=Object.keys(dmPeers).sort();
  var extra=peers.length?'<div class="roomhead">People</div>':'';
  el.innerHTML=htmlp+
    rooms.map(function(r){return '<div class="room'+(curRoom===r?' on':'')+
      '" data-r="'+r+'">'+roomLabel(r)+'</div>';}).join('')+
    '<div class="roomhead">Feed</div>'+
    '<div class="room'+(curRoom==='social'?' on':'')+
      '" data-r="social">Social</div>'+
    extra+
    peers.map(function(p){var r='dm:'+p;
      return '<div class="room'+(curRoom===r?' on':'')+
      '" data-r="'+r+'">'+p+'</div>';}).join('');
  var items=el.getElementsByClassName('room');
  for(var i=0;i<items.length;i++)
    items[i].onclick=(function(r){return function(){switchRoom(r);};})(
      items[i].getAttribute('data-r'));
}
function switchRoom(r){
  curRoom=r;stSet('xprs_room',r);
  cancelReply();
  seen={};
  document.getElementById('msgs').innerHTML='';
  renderSide();
  for(var i=0;i<allRows.length;i++)render(allRows[i]);
  document.getElementById('txt').placeholder=
    r==='local'?'Message (stays local)':
    r==='global'?'Message (goes everywhere)':
    r==='social'?'Status update (published to everyone)':
    'Message to '+r.slice(3);
}
function openDm(call){
  var p=baseCall(call);
  if(p===baseCall(mycall))return;
  dmPeers[p]=true;
  switchRoom('dm:'+p);
}
function render(row){
  var w=row.wire||'';
  if((row.type||'')==='reaction'||w.indexOf('t:reaction ')===0){
    if(!seen[w]){seen[w]=1;applyReaction(row);}
    return;
  }
  var room=roomOf(row);
  if(room===null)return;
  if(room.slice(0,3)==='dm:')dmPeers[room.slice(3)]=true;
  if(allRows.indexOf(row)<0)allRows.push(row);
  if(room!==curRoom){renderSide();return;}
  if(seen[w])return;seen[w]=1;
  var mi=w.indexOf(' m:');
  var text=mi>=0?w.slice(mi+3):'';
  if(!text)return;
  if(clearedBefore&&(row.ts||0)<clearedBefore)return;   /* user hit Clear */
  var own=row.from===mycall;
  var id=wireId(w);
  var rm=w.match(/ r:([0-9a-f]{6})/);
  var rootm=w.match(/ root:([0-9a-f]{6})/);
  idmap[id]={from:row.from,text:text,r:rm?rm[1]:'',
             root:rootm?rootm[1]:'',
             scopeLocal:/ scope:local(?: |$)/.test(w)};
  var d=document.createElement('div');
  d.className='msg '+(own?'local':'remote');
  var when=row.ts?new Date(row.ts*1000).toLocaleTimeString():'';
  var badge=row.sig==='verified'?'<span class="badge ok">signed</span>'
           :(row.sig==='none'?'<span class="badge bad">unsigned</span>':'');
  /* mood: (27.1) is decoration: one italic word beside the post. */
  var mm=w.match(/ mood:([a-z]+) /);
  if(mm)badge+='<span class="mood">'+mm[1]+'</span>';
  var extras='<span class="likes"></span>'+
    '<button class="dots" title="Message options">&#8942;</button>';
  if(own){
    d.innerHTML='<div class="bubble"></div>'+
      '<div class="meta under"><span class="time">'+when+'</span>'+badge+extras+'</div>';
  }else{
    d.innerHTML='<div class="meta"><span class="author"></span>'+
      '<span class="time">'+when+'</span>'+badge+extras+'</div>'+
      '<div class="bubble"></div>';
    var au=d.querySelector('.author');
    au.textContent=row.from;
    au.style.cursor='pointer';
    au.title='Message '+row.from+' directly';
    au.onclick=function(){openDm(row.from);};
    notice();   /* somebody else spoke: beep, vibrate, count in the title */
  }
  domById[id]=d.querySelector('.likes');
  refreshLikes(id);
  d.querySelector('.dots').onclick=function(ev){
    showMsgMenu(ev,id,row.from,own);};
  var bub=d.querySelector('.bubble');
  if(rm){
    /* A receiver that never heard the parent still shows the reply,
     * marked as answering a message it does not hold (6.4). */
    var par=idmap[rm[1]];
    var q=document.createElement('div');
    q.className='quote';
    q.textContent=par?(par.from+': '+par.text.slice(0,60))
                     :('replying to '+rm[1]);
    bub.appendChild(q);
  }
  bub.appendChild(document.createTextNode(text));
  var box=document.getElementById('msgs');
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}
function clearChat(){
  toggleMenu();
  clearedBefore=Math.floor(Date.now()/1000);
  stSet('xprs_cleared',''+clearedBefore);
  seen={};
  document.getElementById('msgs').innerHTML='';
  snack('Chat view cleared');
}
function load(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/api/xprs/history?limit=80',true);
    x.timeout=4000;
    x.onload=function(){
      try{
        var d=JSON.parse(x.responseText);
        var rows=(d.rows||[]).slice().reverse();
        for(var i=0;i<rows.length;i++){
          var t=rows[i].type||'';
          if(t==='message'||t==='reaction'||t==='status')render(rows[i]);
        }
        document.getElementById('stat').textContent=
          (d.held!==undefined?d.held+' packets held':'ok');
      }catch(e){}
    };
    x.send();
  }catch(e){}
}

// ---- boot: an identity exists before the first keystroke ----
(function(){
  var saved=stGet('xprs_nsec');
  var b=saved?nsecDecode(saved):null;
  useKey(b||randKey());
  renderSide();
  switchRoom(curRoom);
  load();
  setInterval(load,3000);
})();
</script></body></html>

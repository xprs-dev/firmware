; Heltec WiFi LoRa 32 V3 -- an XPRS station on an ESP32-S3 with an SX1262 and
; a 128x64 OLED. The station is common/xprs_app; this project is the board.
;
;   build:   ~/.platformio/penv/bin/pio run
;   flash:   ~/.platformio/penv/bin/pio run -t upload
;
; The board has a CP2102 USB-serial bridge, not the S3's native USB, so it
; enumerates as /dev/ttyUSB* and esptool's stub and a fast baud both work --
; none of the T-Dongle's --no-stub / 115200 caveats apply. The port is still
; pinned by-id: with a T-Deck and a T-Dongle on the same bench, "the first
; port" is not a name.
[env:heltec_v3]
platform = espressif32@6.7.0
board = heltec_wifi_lora_32_V3
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
upload_protocol = esptool
upload_speed = 921600
upload_port  = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
; Project-relative on purpose: PlatformIO clones build_flags into every
; component's compile env (lvgl__lvgl included) and resolves `..` oddly.
build_flags =
    -Icomponents/xprs_lvgl
    -Imanaged_components/lvgl__lvgl
    -Imanaged_components/lvgl__lvgl/src

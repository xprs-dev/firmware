# One board's facts, for a program to read. Schema and rules: docs/catalog.md.
#
# Pins and modules are from common/xprs_model_heltec_v3/model_config.h and
# the env in multiboard/platformio.ini; memory from the sdkconfig fragment and
# the chip datasheet. Anything null has not been measured on this bench.

id: heltec-v3
name: WiFi LoRa 32 (V3)
vendor: Heltec Automation
sku: null
product_url: https://heltec.org/project/wifi-lora-32-v3/
manual_url: https://docs.heltec.org/en/node/esp32/wifi_lora_32/index.html
tagline: "ESP32-S3 + SX1262 LoRa + OLED. Same radio as the T-Deck; port pending."
summary: >-
  Heltec WiFi LoRa 32 V3: ESP32-S3 (dual-core 240 MHz, 512 KB RAM, 8 MB
  flash), 0.96" 128x64 SSD1306 OLED, SX1262 LoRa (868/915 or 433 MHz by
  variant), USB-C, LiPo connector, U.FL antenna. Radios: WiFi 2.4 GHz,
  Bluetooth 5 with extended advertising, LoRa. Same MCU and LoRa chip as the
  T-Deck, so an xprs_app port is a pin table away; today it is a multiboard
  target that does not compile.
status: shipping

silicon:
  mcu: ESP32-S3
  family: esp32s3
  core: Xtensa LX7 dual @ 240 MHz
  ram_kb: 512
  psram_mb: null
  flash_mb: 8

radios:
  bluetooth: {version: "5.0 LE", extended_advertising: true, note: "the chip can; the legacy build does not enable BT"}
  wifi: {standards: "802.11 b/g/n", band_ghz: "2.4", modes: "STA, SoftAP"}
  lora: {chip: SX1262, band_mhz: "868 (as configured; 433/915 sold)"}
  other: []

bearers:
  ble5: "yes"
  ble5_note: >-
    tinynimble backend like the T-Dongle (no NimBLE host, no PSRAM to hold
    one). Up as X3H3MZ on the first boot, 2026-08-30, hearing and
    digipeating the bench's beacons within two seconds of the controller
    coming up.
  lora: "untested"
  lora_note: SX1262 on SPI2 (NSS 8, RST 12, BUSY 13, DIO1 14) -- the same part xprs_sx1262 drives on the T-Deck, so a port is pins, not a driver. Not measured.
  lan: "yes"
  lan_note: WiFi STA; associated on the first boot and reachable at /api/status. UDP 4242 like every other station.
  espnow: "yes"
  espnow_note: "peers=1 with the T-Deck on channel 6 from the first alive line."

# The multiboard build predates xprs_app: it is the older station (SoftAP +
# web chat over ESP-Mesh-Lite, APRS-IS iGate, telnet/SSH console) and carries
# no XPRS bearer. Nothing below has been measured since the tree moved, and
# multiboard/README.md says which targets even compile.
xprs:
  beacon: "yes"
  digipeater: "yes"
  bridge: "yes"
  igate: "yes"
  hotspot: "untested"
  hotspot_note: >-
    Compiled in, seeded OFF (.hotspot = false in main.c): no PSRAM, and the
    T-Dongle measured the AP at ~9 KB of internal heap on this chip.
    `cfg set ap_on 1` turns it on.
  api: "yes"
  indexer: "yes"
  share: "yes"
  reticulum: "no"
  reticulum_note: CONFIG_XPRS_BEARER_RNS=n. The hub link's socket and task cost 12.7 KB on the T-Dongle, and this board has none to spare.
  ota: "yes"
  gossip: "yes"
  dashboard: "yes"
  chat: "no"
  chat_note: One button, no keyboard. The read-only chat table on the three-view mini UI.
  mesh_session: "untested"
  mesh_session_note: The GATT channel is measured T-Deck <-> P1-Pro; not on this board.
  vhf: "no"
  vhf_note: No SA818.
  note: "The T-Deck's radio set without the keyboard: LoRa, BLE5, LAN, ESP-NOW, on a 128x64 OLED."
io:
  screen: {controller: SSD1306, width: 128, height: 64}
  buttons:
    - {name: boot, pin: GPIO0, note: "the strap pin"}
  leds: [{name: white, pin: GPIO35}]
  gnss: null
  connectors: [{name: USB-C}, {name: "LiPo JST"}, {name: "U.FL / IPEX", note: "LoRa antenna"}]
  sensors: []

physical:
  dimensions_mm: null
  weight_g: null
  ip_rating: null
  temp_c: null
  power: usb+battery

firmware:
  toolchain: esp-idf
  project: models/heltec-v3/firmware
  env: heltec_v3
  version: 0.1.0
  artifact: models/heltec-v3/prebuilt/firmware.bin
  flash_port: usb-serial
  flashing: "esptool over the CP2102 USB-serial port at 921600; an S3, so the bootloader goes at 0x0. The stub works here; none of the T-Dongle's --no-stub caveats apply."

docs:
  - {title: "Board README", url: "models/heltec-v3/README.md"}
  - {title: "Heltec hardware update log: how to tell V1, V2, V2.1 and V3 apart", url: "https://docs.heltec.org/en/node/esp32/wifi_lora_32/hardware_update_log.html"}
  - {title: "Heltec resource downloads: schematics per version", url: "https://resource.heltec.cn/download/WiFi_LoRa_32/"}

images:
  - file: hardware/images/product-2.png
    caption: 'V3: USB-C, SX1262 under the OLED, the version on the silk.'
    credit: "Heltec Automation product photography, heltec.org"
  - file: hardware/images/product-front.png
    caption: 'In its packaging: the red LoRa 32 label with the band printed on it.'
    credit: "Heltec Automation product photography, heltec.org"

screenshots: []

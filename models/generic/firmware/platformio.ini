; XPRS station on a plain ESP32 devkit.
;
; Any board with an original ESP32 and 4 MB of flash: the ESP32-DevKitC,
; the DOIT DevKit V1, the WROOM-32 boards sold under many names. No screen,
; no buttons, no card, nothing on the pins: WiFi and ESP-NOW, the walk-up
; hotspot with the chat page, the HTTP API. The station is common/xprs_app,
; shared with every other board; what lives in this project is the board.
;
;   build:   ~/.pio-venv/bin/pio run
;   flash:   ~/.pio-venv/bin/pio run -t upload
;   monitor: ~/.pio-venv/bin/pio device monitor
;
; No port is pinned: these boards talk through a CP210x or CH340 bridge,
; and PlatformIO finds it. Add upload_port when more than one is plugged in.
[env:generic]
platform = espressif32@6.7.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv

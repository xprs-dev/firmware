; XPRS station on an ESP32-C3 mini board.
;
; A single-core RISC-V ESP32-C3 with 4 MB of flash, no PSRAM, native USB,
; and no screen: WiFi, ESP-NOW and BLE5, the walk-up hotspot with the chat
; page, the HTTP API. The station is common/xprs_app, shared with every
; other board; what lives in this project is the board.
;
;   build:   ~/.pio-venv/bin/pio run
;   flash:   ~/.pio-venv/bin/pio run -t upload
;   monitor: ~/.pio-venv/bin/pio device monitor
;
; The port is this bench board's by-id path (48:F6:EE:E2:E9:6C); several
; USB-JTAG boards enumerate as ttyACM<n> in plug order.
[env:c3mini]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
; Native USB-JTAG, the same rules as the S3 boards: pin the baud, skip the
; flasher stub.
upload_protocol = esptool
upload_speed = 115200
upload_flags = --no-stub
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_48:F6:EE:E2:E9:6C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_48:F6:EE:E2:E9:6C-if00
; Task stacks sized from `cfg tasks` under load (QEMU, 2026-10-15: the
; hotspot page six at a time, the API, a Reticulum hub delivering XPRS
; announces), each with about a quarter left over. On this chip every
; byte of stack is a byte of the one SRAM; see docs/esp32.md.
build_flags = ${c3stacks.build_flags}

[c3stacks]
build_flags =
    -DXPRS_STACK_IDXWR=5120
    -DXPRS_STACK_UI_HEADLESS=3072
    -DXPRS_STACK_INET=3072
    -DXPRS_STACK_API=5120
    -DXPRS_STACK_RNS=6144

; The same station under Espressif's QEMU (machine esp32c3), for measuring
; stacks and heap without the board: console on UART0, the task report
; every 30 s. QEMU has no WiFi or BLE radio, so what it measures is
; everything else. tools/qemu_c3.sh builds the flash image and runs it.
[env:c3qemu]
extends = env:c3mini
build_flags = ${c3stacks.build_flags} -DXPRS_TASK_REPORT -DXPRS_QEMU
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" -DXPRS_QEMU=1


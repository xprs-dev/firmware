; XPRS station on an ESP32-C3 mini board.
;
; A single-core RISC-V ESP32-C3 with 4 MB of flash, no PSRAM, native USB,
; and no screen: WiFi, ESP-NOW and BLE5, the walk-up hotspot with the chat
; page, the HTTP API. The station is common/xprs_app, shared with every
; other board; what lives in this project is the board.
;
;   build:   ~/.pio-venv/bin/pio run
;   flash:   ~/.pio-venv/bin/pio run -t upload
;   monitor: ~/.pio-venv/bin/pio device monitor
;
; The port is this bench board's by-id path (48:F6:EE:E2:E9:6C); several
; USB-JTAG boards enumerate as ttyACM<n> in plug order.
[env:c3mini]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
; Native USB-JTAG, the same rules as the S3 boards: pin the baud, skip the
; flasher stub.
upload_protocol = esptool
upload_speed = 115200
upload_flags = --no-stub
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_48:F6:EE:E2:E9:6C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_48:F6:EE:E2:E9:6C-if00

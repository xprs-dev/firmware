# One board's facts, for a program to read. Schema and rules: docs/catalog.md.
#
# Measured on the bench board (ESP32-C3 v0.4, 4 MB flash, native USB,
# 48:F6:EE:E2:E9:6C, callsign X30Y64) on 2026-09-11. Anything null has not
# been measured.

id: esp32c3-mini
name: ESP32-C3 Mini
vendor: Espressif (and SuperMini clones)
sku: null
product_url: https://www.espressif.com/en/products/devkits
manual_url: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32c3/esp32-c3-devkitm-1/user_guide.html
tagline: "Cheapest headless station: BLE5, ESP-NOW, LAN and the walk-up chat hotspot, on one core."
summary: >-
  ESP32-C3 mini board: single-core RISC-V at 160 MHz, 400 KB RAM, no PSRAM,
  4 MB flash, native USB, one LED, BOOT button, no screen. Radios: WiFi 2.4
  GHz and Bluetooth 5 with extended advertising. Runs the shared station on
  BLE5, ESP-NOW and the LAN, with the HTTP API and the walk-up hotspot whose
  chat page is how a person uses a board with no screen. No archive: 4 MB of
  flash leaves less room than one index segment. The WiFi and BLE share one
  radio, so the board is tuned for it (short BLE scan, 536-byte TCP segments).
status: shipping

silicon:
  mcu: ESP32-C3
  family: esp32c3
  core: RISC-V single @ 160 MHz
  ram_kb: 400
  psram_mb: null
  flash_mb: 4

radios:
  bluetooth: {version: "5.0 LE", extended_advertising: true, note: "tinynimble on the bare controller, as on the S3 boards"}
  wifi: {standards: "802.11 b/g/n", band_ghz: "2.4", modes: "STA, SoftAP"}
  lora: null
  other: []

bearers:
  ble5: "yes"
  ble5_note: "Heard by the e-paper board at -71 dBm. Short scan window (21%) because it shares the radio with WiFi."
  lora: "no"
  lora_note: No LoRa radio.
  lan: "yes"
  lan_note: "Weak on the bench board's antenna (-84 to -92 dBm); 536-byte TCP segments keep pages flowing beside BLE."
  espnow: "yes"
  espnow_note: "Also received with no LAN, hotspot and BLE up."

xprs:
  beacon: "yes"
  digipeater: "yes"
  bridge: "yes"
  igate: "untested"
  igate_note: The LAN leg is on by default (igate_on); not checked separately on this board.
  hotspot: "untested"
  hotspot_note: "On by default; the access point comes up and the chat page is served (loaded over the LAN), but a phone has not joined it yet."
  api: "yes"
  indexer: "no"
  indexer_note: "4 MB of flash leaves 832 KB for files, less than one 1.3 MB index segment; the log, statistics and conversation are kept."
  share: "no"
  share_note: No archive to share.
  reticulum: "no"
  reticulum_note: CONFIG_XPRS_BEARER_RNS is not set, and there is no RAM for it.
  ota: "untested"
  ota_note: Two 1.5 MB app slots and the push door; no update pushed yet.
  gossip: "untested"
  gossip_note: The gossip store needs the archive's directory, which this board does not have.
  dashboard: "no"
  dashboard_note: No screen (common/xprs_ui_none).
  chat: "no"
  chat_note: Nothing to type on; the hotspot's chat page is the way to chat.
  mesh_session: "no"
  mesh_session_note: Broadcasts and listens; never connects.
  vhf: "no"
  vhf_note: No SA818.
  note: "The first single-core board on xprs_app: see docs/esp32.md, the ESP32-C3 section."

io:
  screen: null
  buttons:
    - {name: boot, pin: GPIO9, note: "the C3 strap pin; not used by the firmware"}
  leds: [{name: led, pin: GPIO8, note: "plain on a SuperMini, addressable on a DevKitM-1; not used"}]
  gnss: null
  connectors: [{name: USB, note: "native USB-JTAG CDC (USB-C on a SuperMini)"}]
  sensors: []

physical:
  dimensions_mm: null
  weight_g: null
  ip_rating: null
  temp_c: null
  power: usb

firmware:
  toolchain: esp-idf
  project: models/esp32c3-mini/firmware
  env: c3mini
  version: 0.1.0
  artifact: models/esp32c3-mini/prebuilt/firmware.bin
  flash_port: native-usb
  flashing: "esptool over the by-id USB-JTAG CDC port, --no-stub, 115200 pinned"

docs:
  - {title: "Board README", url: "models/esp32c3-mini/README.md"}
  - {title: "Station plan (written before the work)", url: "models/esp32c3-mini/docs/station-plan.md"}

images:
  - file: hardware/images/product-front.png
    caption: 'ESP32-C3-DevKitM-1, isometric.'
    credit: "Espressif, ESP32-C3-DevKitM-1 user guide"
  - file: hardware/images/annotated.png
    caption: 'Annotated photo: the module, the two buttons, the RGB LED on GPIO8.'
    credit: "Espressif, ESP32-C3-DevKitM-1 user guide"
  - file: hardware/images/pinout.png
    caption: 'Pinout.'
    credit: "Espressif, ESP32-C3-DevKitM-1 user guide"

screenshots: []

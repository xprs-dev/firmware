# One board's facts, for a program to read. Schema and rules: docs/catalog.md.
#
# A field nobody has measured is null, never a guess. A blank can be filled;
# a plausible lie cannot be found.

id:          # models/ folder name, kebab-case
name:
vendor:
sku:
product_url:
manual_url:  # vendor manual, datasheet or wiki for this board
tagline:     # ONE line for the gallery tile: what it is, what it carries
summary:     # a paragraph: what the device is (MCU, memory, screen, radios, ports), then what the station on it does
status:      # shipping | legacy | planned | unsupported

silicon:
  mcu:
  family:    # esp32 | esp32s3 | esp32c3 | nrf52 -- the TOOLCHAIN family
  core:
  ram_kb:
  psram_mb:  # null when there is none
  flash_mb:

# What the board physically carries, in the vendor's terms.
radios:
  bluetooth:   # {version: "5.0", extended_advertising: true|false, note: ...} or null
  wifi:        # {standards: "802.11 b/g/n", band_ghz: "2.4", modes: "STA, SoftAP"} or null
  lora:        # {chip: SX1262, band_mhz: "862-930"} or null
  other:       []   # anything else that transmits, e.g. {name: SA818, note: "VHF 134-174 MHz"}

# What this board can do on the XPRS network, and WHY. yes | no | untested.
bearers:
  ble5:
  ble5_note:
  lora:
  lora_note:
  lan:
  lan_note:
  espnow:
  espnow_note:

# What the station on this board DOES. yes | no | planned | untested,
# with a _note for anything that is not a plain yes. Roles: docs/catalog.md.
xprs:
  beacon:
  digipeater:
  bridge:
  igate:
  hotspot:
  api:
  indexer:
  share:
  reticulum:
  ota:
  gossip:
  dashboard:
  chat:
  mesh_session:
  vhf:
  note:        # one line on what this board's station is, or null

io:
  screen:      # {controller, width, height} or null
  buttons:     []
  leds:        []
  gnss:        # module name or null
  connectors:  []
  sensors:     []

physical:
  dimensions_mm:
  weight_g:
  ip_rating:
  temp_c:
  power:       # how it is fed: usb | battery | solar+battery | ...

firmware:
  toolchain:   # esp-idf | zephyr | arduino-nrf52 | ...
  project:     # path to the buildable project, or null
  env:         # PlatformIO env name, or null
  version:     # contents of version.txt, or null
  artifact:    # path to a published binary, or null
  flash_port:  # usb-serial | native-usb | uf2
  flashing:    # one line: how an image gets onto it

docs: []       # - {title: ..., url: ...}

images: []     # - {file: hardware/images/x.jpg, caption: ..., credit: ...}

screenshots: []  # - {file: docs/screenshots/x.png, caption: ...} -- what the firmware shows

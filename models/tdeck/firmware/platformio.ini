; XPRS station on a LilyGO T-Deck.
;
; ESP32-S3 with a 320x240 ST7789, a trackball, an I2C QWERTY keyboard and an
; SX1262 on 868 MHz. The station itself is common/xprs_app, shared with the
; M5Stack; what lives in this project is the board.
;
;   build:   ~/.platformio/penv/bin/pio run
;   flash:   ~/.platformio/penv/bin/pio run -t upload
;   monitor: ~/.platformio/penv/bin/pio device monitor
;
; THERE ARE TWO ESP32-S3 USB-JTAG BOARDS ON THE BENCH — this one and the
; T-Dongle — and they enumerate as ttyACM0/ttyACM1 in whatever order they were
; plugged in. Flashing the wrong one costs an afternoon, so the ports below are
; by-id paths, which are stable across replugs. The T-Deck is DC:DA:0C:3C:24:C8;
; the dongle (48:CA:43:4B:B7:C4) is the station that answers as X3WWAJ.
[env:tdeck]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; The baud rate on a native-USB port is a fiction -- the CDC link runs at USB
; speed whatever number is written here -- and esptool's default attempt to
; "change" it to 460800 gets no answer, which reads as "No serial data
; received" after a connection that had in fact just succeeded. Pin it.
; The flasher stub then loses the link on this board ("Unable to verify flash
; chip connection"), so skip it -- the ROM loader is slower to start and
; perfectly reliable here.
upload_speed = 115200
upload_flags = --no-stub
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:3C:24:C8-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:3C:24:C8-if00
; LVGL for the UI: the shared lv_conf.h (components/geogram_lvgl) plus the
; managed lvgl__lvgl headers. Paths must be project-relative — see the
; T-Dongle project's platformio.ini for the explanation.
build_flags =
    -Icomponents/geogram_lvgl
    -Imanaged_components/lvgl__lvgl
    -Imanaged_components/lvgl__lvgl/src
    -DTDECK_VARIANT_ORIGINAL=1

; The T-Deck Plus is this board plus a GPS on a UART and a battery gauge on the
; I2C bus that is already there. Same pins, same sdkconfig, so it is a flag —
; not a project. Uncomment and give it its own by-id port when one arrives.
; [env:tdeck_plus]
; extends = env:tdeck
; build_flags =
;     -Icomponents/geogram_lvgl
;     -Imanaged_components/lvgl__lvgl
;     -Imanaged_components/lvgl__lvgl/src
;     -DTDECK_VARIANT_PLUS=1

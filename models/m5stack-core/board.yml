# One board's facts, for a program to read. Schema and rules: docs/catalog.md.
id: m5stack-core
name: M5Stack Core
vendor: M5Stack
sku: null
product_url: https://docs.m5stack.com/en/core/basic
manual_url: https://docs.m5stack.com/en/core/basic
tagline: "Boxed ESP32 with a 320x240 screen and three buttons. WiFi and ESP-NOW station with the full dashboard."
summary: >-
  M5Stack Core Basic: original ESP32 (dual-core 240 MHz, 520 KB RAM, 16 MB
  flash) in a 54 mm stackable case with a 320x240 ILI9342C LCD, three front
  buttons, speaker, microSD, Grove port, USB-C and a 110 mAh battery. Radios:
  WiFi 2.4 GHz and Bluetooth 4.2 (legacy advertising only, so no BLE5 bearer).
  Runs xprs_app over LAN and ESP-NOW with the seven-panel dashboard, hotspot
  AP with the chat page, digipeater, iGate, indexer and signed OTA. Used as
  the second station on the bench: anything the T-Dongle or T-Deck sends has
  something to hear it.
status: shipping

silicon:
  mcu: ESP32
  family: esp32
  core: Xtensa LX6 dual @ 240 MHz
  ram_kb: 520
  psram_mb: null
  flash_mb: 16

radios:
  bluetooth: {version: "4.2 LE", extended_advertising: false, note: "original ESP32: 31-byte legacy advertising only"}
  wifi: {standards: "802.11 b/g/n", band_ghz: "2.4", modes: "STA, SoftAP"}
  lora: null
  other: []

bearers:
  ble5: "no"
  ble5_note: >-
    An original ESP32 (D0WDQ6): legacy 31-byte advertising only. An XPRS
    beacon runs to 112-173 bytes, so this bearer cannot exist here at all --
    see docs/esp32.md, "Radio capability per chip".
  lora: "no"
  lora_note: No radio on this board.
  lan: "yes"
  lan_note: null
  espnow: "yes"
  espnow_note: "What this board is here for."

xprs:
  beacon: "yes"
  digipeater: "yes"
  bridge: "yes"
  igate: "yes"
  hotspot: "yes"
  api: "yes"
  indexer: "yes"
  share: "yes"
  reticulum: "untested"
  reticulum_note: xprs_app brings xprsrns up on every board; not measured here since the rewrite.
  ota: "yes"
  gossip: "yes"
  dashboard: "yes"
  chat: "no"
  chat_note: Three buttons, no keyboard. The read-only chat table.
  mesh_session: "no"
  mesh_session_note: No BLE5 on this chip, so no BLE bearer to carry a session.
  vhf: "no"
  vhf_note: No SA818.
  note: "The second voice on the air: ESP-NOW and LAN, seven-panel dashboard."

io:
  screen: {controller: ILI9342C, width: 320, height: 240}
  buttons:
    - {name: A, pin: GPIO39, note: "short: next panel or OK. held: home"}
    - {name: B, pin: GPIO38, note: "up"}
    - {name: C, pin: GPIO37, note: "down"}
  leds: []
  gnss: null
  connectors:
    - {name: USB-C}
    - {name: microSD}
    - {name: Grove}
  sensors: []

physical:
  dimensions_mm: null
  weight_g: null
  ip_rating: null
  temp_c: null
  power: usb+battery

firmware:
  toolchain: esp-idf
  project: models/m5stack-core/firmware
  env: m5stack
  version: 0.2.0
  artifact: models/m5stack-core/prebuilt/firmware.bin
  flash_port: usb-serial
  flashing: "esptool over the CP210x USB-serial port"

docs:
  - {title: "Board README", url: "models/m5stack-core/README.md"}


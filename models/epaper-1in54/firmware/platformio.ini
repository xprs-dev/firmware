; XPRS station on a Waveshare ESP32-S3-ePaper-1.54.
;
; ESP32-S3 behind a 200x200 black-and-white e-paper panel, with an SHTC3,
; an RTC, a microSD slot, an audio codec and a battery. The station itself
; is common/xprs_app, shared with the T-Deck, the T-Dongle and the M5Stack;
; what lives in this project is the board.
;
;   build:   ~/.pio-venv/bin/pio run
;   flash:   ~/.pio-venv/bin/pio run -t upload
;   monitor: ~/.pio-venv/bin/pio device monitor
;
; Laid out for the V1 board (ESP32-S3FH4R2: 4 MB flash, 2 MB quad PSRAM),
; so it also runs on the V2 (8 MB and 8 MB). See src/board.h.
;
; Several ESP32-S3 USB-JTAG boards live on this bench and enumerate as
; ttyACM<n> in plug order, so the port is the by-id path of THIS board,
; B8:F8:62:D8:BF:20. Change both lines for another one.
[env:epaper]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
; Native USB-JTAG: the baud is a fiction (pin it) and the flasher stub loses
; the link (skip it). The T-Deck's and the T-Dongle's rules.
upload_protocol = esptool
upload_speed = 115200
upload_flags = --no-stub
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_B8:F8:62:D8:BF:20-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_B8:F8:62:D8:BF:20-if00
; LVGL: the managed lvgl__lvgl headers on every component's include path,
; with the paths project-relative (PlatformIO resolves ".." oddly).
build_flags =
    -Icomponents/xprs_lvgl
    -Imanaged_components/lvgl__lvgl
    -Imanaged_components/lvgl__lvgl/src

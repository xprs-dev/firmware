; XPRS station on a LilyGO T-Dongle-S3.
;
; ESP32-S3 with a 160x80 ST7735 and a microSD slot, on a USB stick. The
; station itself is common/xprs_app, shared with the T-Deck and the
; M5Stack; what lives in this project is the board.
;
;   build:   ~/.platformio/penv/bin/pio run
;   flash:   ~/.platformio/penv/bin/pio run -t upload
;   monitor: ~/.platformio/penv/bin/pio device monitor
;
; THERE ARE TWO ESP32-S3 USB-JTAG BOARDS ON THE BENCH — this one and the
; T-Deck — and they enumerate as ttyACM0/ttyACM1 in whatever order they were
; plugged in. Flashing the wrong one costs an afternoon, so the ports below
; are by-id paths, which are stable across replugs. This dongle is
; 48:CA:43:4B:B7:C4; the T-Deck is DC:DA:0C:3C:24:C8.
[env:tdongle]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
; 2MB factory app (LVGL + WiFi + the index outgrow 1MB); NVS stays at 0x9000
; so the identity persists. PlatformIO uses this for the size check too.
board_build.partitions = partitions.csv
; esptool over the named CDC port, NOT esp-builtin: OpenOCD ignores
; upload_port and grabs the first USB-JTAG on the machine, and with a
; T-Deck on the same bench that flashed THIS firmware onto THAT board.
; Same native-USB rules as the T-Deck: the baud is a fiction (pin it)
; and the flasher stub loses the link (skip it).
upload_protocol = esptool
upload_speed = 115200
upload_flags = --no-stub
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_48:CA:43:4B:B7:C4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_48:CA:43:4B:B7:C4-if00
; LVGL for the UI: the shared lv_conf.h (components/xprs_lvgl) plus the
; managed lvgl__lvgl headers. LVGL finds lv_conf.h via
; __has_include/LV_CONF_INCLUDE_SIMPLE on the include path, and these -I
; flags are cloned into every component compile env (lvgl__lvgl and the UI
; included). Paths must be project-relative: xprs_lvgl and
; managed_components are symlinked into this project dir, and PlatformIO
; resolves ".." oddly.
build_flags =
    -Icomponents/xprs_lvgl
    -Imanaged_components/lvgl__lvgl
    -Imanaged_components/lvgl__lvgl/src

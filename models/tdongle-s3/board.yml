# One board's facts, for a program to read. Schema and rules: docs/catalog.md.
id: tdongle-s3
name: T-Dongle-S3
vendor: LilyGO
sku: null
product_url: https://www.lilygo.cc/products/t-dongle-s3
manual_url: https://github.com/Xinyuan-LilyGO/T-Dongle-S3
summary: >-
  LilyGO USB-A stick: ESP32-S3 (dual-core 240 MHz, 512 KB RAM, no PSRAM, 16 MB
  flash), 160x80 ST7735 colour LCD, microSD slot, one BOOT button, USB-JTAG
  serial. Radios: WiFi 2.4 GHz and Bluetooth 5 with extended advertising. Runs
  the full xprs_app station: BLE5, LAN and ESP-NOW bearers, digipeater, cross-
  bearer bridge, APRS-IS iGate, HTTP API, indexer, signed OTA. Meant to be
  plugged in next to a router as the BLE-to-LAN bridge; the screen cycles
  three status views on its own since the button is usually under the case.
status: shipping

silicon:
  mcu: ESP32-S3
  family: esp32s3
  core: Xtensa LX7 dual @ 240 MHz
  ram_kb: 512
  psram_mb: null
  flash_mb: 16

radios:
  bluetooth: {version: "5.0 LE", extended_advertising: true, note: "ESP32-S3 controller; one XPRS packet fits one extended AD"}
  wifi: {standards: "802.11 b/g/n", band_ghz: "2.4", modes: "STA; SoftAP possible but off by default (heap)"}
  lora: null
  other: []

bearers:
  ble5: "yes"
  ble5_note: >-
    An S3, so extended advertising is available and an XPRS packet fits one
    AD. Runs the tinynimble backend (CONFIG_XPRSBLE_BACKEND_TINYNIMBLE), not
    the NimBLE host: no PSRAM here, and the host's msys pools, ACL buffers
    and 5,120-byte task stack were all internal DRAM.
  lora: "no"
  lora_note: No radio on this board.
  lan: "yes"
  lan_note: WiFi STA. The other half of the bridge, and why the board exists.
  espnow: "yes"
  espnow_note: null

xprs:
  beacon: "yes"
  digipeater: "yes"
  bridge: "yes"
  igate: "yes"
  hotspot: "untested"
  hotspot_note: >-
    Compiled in, seeded OFF (.hotspot = false in main.c): the AP costs ~9 KB
    of internal heap and this board has no PSRAM. `cfg set ap_on 1` turns it on.
  api: "yes"
  indexer: "yes"
  share: "yes"
  reticulum: "untested"
  reticulum_note: xprs_app brings xprsrns up on every board; not measured here since the rewrite.
  ota: "yes"
  gossip: "yes"
  dashboard: "yes"
  chat: "no"
  chat_note: Nothing to type on. The read-only chat table, on the three-view mini UI.
  mesh_session: "untested"
  mesh_session_note: The GATT channel is measured T-Deck <-> P1-Pro (docs/ble5-gatt.md), not on this board.
  vhf: "no"
  vhf_note: No SA818.
  note: "The BLE5 bridge: hears on Bluetooth, repeats on LAN and ESP-NOW, and back."

io:
  screen: {controller: ST7735, width: 160, height: 80}
  buttons:
    - {name: boot, pin: GPIO0, note: "the strap pin; there is no other button, and it is half under the case in most mountings"}
  leds: []
  gnss: null
  connectors:
    - {name: USB-A, note: "male, the body of the stick; native USB-JTAG CDC"}
    - {name: microSD, note: "present, but the archive lives in internal flash since 0.4.0"}
  sensors: []

physical:
  dimensions_mm: null
  weight_g: null
  ip_rating: null
  temp_c: null
  power: usb

firmware:
  toolchain: esp-idf
  project: models/tdongle-s3/firmware
  env: tdongle
  version: 0.4.0
  artifact: models/tdongle-s3/prebuilt/firmware.bin
  flashing: "esptool over the by-id USB-JTAG CDC port, --no-stub, 115200 pinned"

docs:
  - {title: "Board README", url: "models/tdongle-s3/README.md"}
  - {title: "Memory and scheduling, binding on this board", url: "docs/esp32.md"}


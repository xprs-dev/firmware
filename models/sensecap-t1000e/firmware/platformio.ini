; XPRS station on a SenseCAP Card Tracker T1000-E: a carried card.
;
; nRF52840 + LR1110, on the Adafruit nRF52 Arduino core (Seeed's fork), the
; same toolchain as models/sensecap-p1-pro. The shared code arrives through
; lib/ as symlinks into common/.
;
;   build:   ~/.pio-venv/bin/pio run
;   flash:   ~/.pio-venv/bin/pio run -t upload --upload-port <port>
;
; FIRST INSTALL FROM STOCK: the card's bootloader is Adafruit's UF2 one
; ("T1000-E-BOOT", 239a:8029). Hold the button while plugging in the cable
; for the bootloader; the upload below speaks its serial DFU. The way back to
; Meshtastic is copying ~/code/2026/xteink/meshtastic/nrf52-extracted/
; firmware-tracker-t1000-e-2.7.15.567b8ea.uf2 onto the boot drive (README).
[env:t1000e]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
; The odd board id is the Seeed platform's rule, not ours: its platform.py
; selects the Adafruit nRF52 core only for a board id containing
; "afruitnrf52-nrf52840" (platform_cfg/nrf_cfg.py), and fails with "no config
; Architecture" otherwise.
board = seeed-t1000e-afruitnrf52-nrf52840
board_build.variants_dir = variants
framework = arduino
monitor_speed = 115200

; RadioLib pinned EXACTLY: the LR1110's duty-cycled receive depends on how
; this version computes the sleep window (startReceiveDutyCycleAuto's
; minSymbols default of 8 silently gives continuous RX against a 16-symbol
; preamble). A newer RadioLib must be re-measured, not assumed.
lib_deps =
    jgromes/RadioLib@7.7.1

build_flags =
    -DTN_PORT_SD
    -DMT_SMALL
    -DMC_SMALL
    -ffunction-sections
    -fdata-sections
build_unflags = -fno-function-sections
extra_scripts =
    pre:version.py
    post:scripts/post_uf2.py

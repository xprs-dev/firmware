; XPRS station on a SenseCAP Solar Node P1-Pro.
;
; THE ONE BOARD IN THIS TREE THAT IS NOT AN ESP32. Nordic nRF52840 under the
; Adafruit nRF52 Arduino core, so there is no ESP-IDF here, no components/,
; and no sdkconfig -- the shared code arrives through lib/ instead, which is
; PlatformIO's own mechanism and needs nothing special.
;
;   build:   ~/.platformio/penv/bin/pio run
;   flash:   ~/.platformio/penv/bin/pio run -t upload
;   monitor: ~/.platformio/penv/bin/pio device monitor
;
; FLASHING IS NOT esptool. The XIAO carries an Adafruit UF2 bootloader; the
; upload below opens the port at 1200 baud to drop the board into it, then
; writes with adafruit-nrfutil. Copying a .uf2 onto the mass-storage volume
; by hand (double-tap reset) does the same thing and is the fallback when
; the port is not enumerating.
[env:p1pro]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-plus
framework = arduino
monitor_speed = 115200

; RadioLib rather than a port of common/xprs_sx1262. The XPRS driver is
; ESP-IDF SPI from top to bottom and would have had to be rewritten around
; Arduino's; RadioLib already drives this exact part, is maintained, and
; leaves the shared code to be the thing that is actually worth sharing --
; the wire format and the relay decision, which is what lib/ holds.
lib_deps =
    jgromes/RadioLib@^7.2.1

; TN_PORT_SD selects tinynimble's SoftDevice port (lib/tinynimble ->
; common/tinynimble/tn_port_sd.c): BLE5 extended advertising straight from
; the S140, bypassing Bluefruit and its 31-byte buffers (docs/ble5-nrf52.md).
build_flags = -DTN_PORT_SD

; The station's own two files, symlinked from common/ exactly as every ESP32
; board symlinks its components. They compile here unmodified:
;   xprs_codec   the wire format. Its one platform seam is xprs_sha256(),
;                filled by xprs_sha256_sw.c (library.json selects it; the IDF
;                build takes xprs_sha256_idf.c and mbedtls instead).
;   xprs_bearer  the queue, the duplicate rings, the relay decision.

; THIS BOARD HAS TWO by-id NAMES AND THEY ARE NOT INTERCHANGEABLE. Running
; the application it is ..._XIAO_nRF52840_<serial>; sitting in the UF2
; bootloader it is ..._XIAO-BOOT_<serial>, a different VID:PID (2886:0059)
; and therefore a different path. Pin the APPLICATION one: the 1200-baud
; touch below drops the board into the bootloader and PlatformIO then waits
; for that second port to appear by itself. Pinning the BOOT name works
; exactly once -- while the board happens to be sitting in the bootloader --
; and fails with "No such file or directory" every time after.
;
; The serial (61022839E75C91AE) is this specific unit. A second P1-Pro on the
; bench gets its own env, the same way the two ESP32-S3s do.
upload_port  = /dev/serial/by-id/usb-Seeed_Studio_XIAO_nRF52840_61022839E75C91AE-if00
monitor_port = /dev/serial/by-id/usb-Seeed_Studio_XIAO_nRF52840_61022839E75C91AE-if00

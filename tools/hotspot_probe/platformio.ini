; The hotspot probe: an ESP32-C3 used as test equipment. It joins every
; XPRS-* hotspot in reach in turn, fetches the chat page and the API from
; the gateway, and prints one PROBE line per hotspot on its USB console, so
; a host can check the walk-up chat without giving up its own WiFi.
;
;   pio run -t upload --upload-port /dev/serial/by-id/<the C3>
;   then read the console: PROBE <ssid> ... lines every two minutes.
[env:c3probe]
platform = espressif32@6.7.0
framework = espidf
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_upload.flash_size = 4MB
monitor_speed = 115200

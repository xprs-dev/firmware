; tinynimble_probe -- two T-Decks, BLE5 extended advertising, and nothing else.
;
; The point is what is ABSENT: no NimBLE host, no WiFi, no LVGL, no bearers, no
; index. The real firmware runs all of those and cannot answer whether talking
; to the controller directly puts the right bytes on the air -- this can.
;
; Both boards run the same source and are told apart at runtime by their own
; MAC, so there is one binary and no chance of flashing the wrong role.
;
;   deck A (DC:DA:0C:39:F6:54): pio run -e deckA -t upload
;   deck B (DC:DA:0C:3C:24:C8): pio run -e deckB -t upload
;
; Drive over serial: 'a' advertise once, 'A' advertise repeatedly, 's' scan,
; 'x' stop everything (the teardown that matters), '?' status.
[env]
platform = espressif32@6.7.0
framework = espidf
monitor_speed = 115200
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_speed = 115200
upload_flags = --no-stub

[env:deckA]
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:39:F6:54-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:39:F6:54-if00

; The A/B: same board, same test, NimBLE instead. Built with
;   PROBE_NIMBLE=1 pio run -e deckA_nimble -t upload
[env:deckA_nimble]
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:39:F6:54-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:39:F6:54-if00
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.nimble"

[env:deckB]
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:3C:24:C8-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_DC:DA:0C:3C:24:C8-if00
